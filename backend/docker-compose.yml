version: '3.8'

services:
  main: 
    container_name: main
    build:
      context: . 
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 5000:5000
    command: npm run start:dev
    depends_on:
      - postgres
    restart: always


  postgres: 
    container_name: postgres
    image: postgres:18 
    env_file:
      - .env.development
    # environment: 
      # PG_DATA: /var/lib/postgresql/data
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always

volumes:
  pgdata:


