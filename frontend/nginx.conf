# nginx для продакшн-сборки фронтенда (содержимое frontend/dist).
#
# Главное здесь — `try_files ... /index.html`: приложение это SPA, реальных
# файлов /portrait, /welcome, /chat/123 на диске нет. Без фоллбэка nginx отдаёт
# свой 404 на прямой переход по ссылке и на F5 — до react-router дело не доходит,
# работает только "/".
#
# Coolify (Static build pack): вставить целиком в поле Custom Nginx Configuration.
# Свой nginx на хосте: положить в /etc/nginx/conf.d/persona.conf, поправить
# server_name / root, затем `nginx -t && systemctl reload nginx`.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Ассеты собираются с хэшем в имени, поэтому кэшируются навсегда.
    # Отдельный location нужен ещё и затем, чтобы промах по ассету возвращал
    # честный 404, а не index.html с кодом 200 (иначе битый импорт выглядит как
    # "модуль отдал HTML" и отлаживается втрое дольше).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя браузер продолжает тянуть
    # старые хэши ассетов, которых на сервере уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Собственно SPA-фоллбэк.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
