# Two independent npm packages, no root workspace — each job cd's into its
# package (see CLAUDE.md). The backend has no ESLint config and no spec files
# yet, so its job is the full TypeScript compile (nest build), which is the
# strongest check it has today; add lint/test steps here when those land.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Backend — build (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # prisma.config.ts reads DATABASE_URL at load time; generate never connects,
      # so any well-formed URL satisfies it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The Prisma client is generated into backend/generated/ (not committed).
      - run: npx prisma generate
      - run: npm run build

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
